[package]
name = "bloathound"
version = "0.2.4"
edition = "2021"
authors = ["Arthur <https://github.com/Arthur-911>"]
description = "A blazing-fast, safety-first developer artifact and cache purger with file lifecycle analytics and integrity verification."
repository = "https://github.com/Arthur-911/BloatHound"
license = "MIT"
keywords = ["cli", "cleaner", "cache", "disk-space", "developer-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
comfy-table = "7.1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
indicatif = "0.17"
dialoguer = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

